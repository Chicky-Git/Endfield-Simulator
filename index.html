<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终末地 | 寻访模拟系统</title>
    <style>
        :root {
            --accent-yellow: #ffe600; 
            --ui-black: #1a1a1a;
            --ui-white: #ffffff;
            --r6-color: #ff4400; /* 6星烈焰色 */
            --r5-color: #ffcc00; /* 5星金黄色 */
            --r4-color: #00ccff; /* 4星科技蓝 */
            --text-red: #ff3333; /* 新增：记录专用红色 */
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: #000;
            color: var(--ui-white);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* === 背景立绘层 === */
        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            transition: background-image 0.4s ease; z-index: 0;
        }
        #bg-layer::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.9) 100%);
        }

        /* === UI 顶栏 === */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 70px;
            display: flex; justify-content: flex-end; align-items: center;
            padding: 0 40px; z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .resource-tag {
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 4px;
            font-size: 0.95rem; display: flex; align-items: center; gap: 12px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .resource-icon { width: 14px; height: 14px; background: #ff4444; transform: rotate(45deg); display: inline-block; }

        /* === 左侧卡池选择 === */
        .left-sidebar {
            position: absolute; top: 50%; left: 0; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px; padding-left: 20px; z-index: 10;
        }
        .pool-tab {
            width: 140px; height: 70px; background: rgba(0,0,0,0.5);
            border-left: 4px solid transparent; color: #aaa;
            cursor: pointer; display: flex; flex-direction: column; justify-content: center; padding-left: 15px;
            transition: 0.2s; clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);
        }
        .pool-tab.active {
            background: var(--ui-white); color: var(--ui-black);
            border-left: 4px solid var(--accent-yellow); width: 160px; font-weight: bold;
        }

        /* === 左下角：历史记录按钮 === */
        .history-btn {
            position: absolute; bottom: 40px; left: 40px; z-index: 20;
            background: rgba(30,30,30,0.8); border: 1px solid #555;
            color: #ddd; padding: 10px 20px; cursor: pointer;
            font-size: 0.9rem; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .history-btn:hover { background: #333; border-color: #fff; color: #fff; }

        /* === 右侧操作区 === */
        .right-panel {
            position: absolute; bottom: 40px; right: 40px;
            text-align: right; z-index: 10;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        .banner-info h1 { font-size: 3rem; margin: 0; font-style: italic; line-height: 1; text-transform: uppercase; }
        .banner-info .sub-text {
            color: var(--accent-yellow); font-size: 1rem; font-weight: bold;
            background: rgba(0,0,0,0.8); display: inline-block; padding: 2px 8px; margin-top: 5px;
        }
        .pity-counter {
            background: rgba(0,0,0,0.7); padding: 10px 20px; margin-bottom: 20px;
            border-left: 3px solid var(--accent-yellow); text-align: left;
            font-size: 0.85rem; color: #ddd; width: 280px;
        }
        .pity-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .pity-val { color: var(--accent-yellow); font-weight: bold; }
        
        .action-btns { display: flex; gap: 10px; }
        .btn {
            height: 60px; min-width: 140px; border: none; cursor: pointer;
            font-weight: bold; font-size: 1.1rem;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-white { background: #e0e0e0; color: #000; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
        .btn-yellow { background: var(--accent-yellow); color: #000; clip-path: polygon(0 0, 100% 0, 100% 50px, calc(100% - 10px) 100%, 0 100%); min-width: 180px; }
        .btn .sub { font-size: 0.7rem; font-weight: normal; opacity: 0.7; margin-top: -2px; }

        /* === 抽卡结果弹窗 (3D 翻转风格) === */
        .overlay-layer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
            display: none; justify-content: center; align-items: center; flex-direction: column;
        }
        .overlay-layer.active { display: flex; animation: fadeIn 0.3s; }
        
        .result-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; 
            max-width: 1200px; width: 90%; perspective: 1000px; 
        }

        .card-scene {
            aspect-ratio: 3/4.5;
            position: relative;
            opacity: 0;
            animation: cardEnter 0.5s forwards;
        }

        .card-obj {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card-obj.flipped { transform: rotateY(180deg); }

        .face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            border-radius: 4px; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* 卡背 */
        .face.back {
            background: #151515; border: 1px solid #333;
            justify-content: center; align-items: center;
            background-image: 
                linear-gradient(45deg, transparent 45%, #333 49%, #333 51%, transparent 55%),
                linear-gradient(-45deg, transparent 45%, #333 49%, #333 51%, transparent 55%);
            background-size: 30px 30px;
        }
        .face.back::after {
            content: 'ENDFIELD'; color: #444; font-weight: 900; 
            font-size: 1.2rem; letter-spacing: 2px; transform: rotate(-45deg);
        }
        /* 卡背光效 */
        .card-scene.r6 .face.back { border: 2px solid var(--r6-color); box-shadow: 0 0 15px rgba(255, 68, 0, 0.2); }
        .card-scene.r5 .face.back { border: 2px solid var(--r5-color); }

        /* 卡面 */
        .face.front {
            background: #222; transform: rotateY(180deg);
            background-size: cover; background-position: center; border: 1px solid #444;
        }
        .card-scene.r6 .face.front { 
            box-shadow: 0 0 25px rgba(255, 68, 0, 0.5); border-bottom: 4px solid var(--r6-color);
        }
        .card-scene.r5 .face.front { 
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3); border-bottom: 4px solid var(--r5-color);
        }
        .card-scene.r4 .face.front { border-bottom: 4px solid var(--r4-color); }

        .card-info { 
            margin-top: auto; 
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6));
            padding: 10px; text-align: center; position: relative; z-index: 2;
        }
        .card-name { font-size: 0.9rem; font-weight: bold; color: #fff; }
        .card-star { font-size: 1.2rem; display: block; margin-bottom: 2px; line-height: 1;}
        .r6 .card-star { color: var(--r6-color); }
        .r5 .card-star { color: var(--r5-color); }
        .r4 .card-star { color: var(--r4-color); }

        .tag-up { 
            position: absolute; top:0; right:0; background: #ff3333; color:white; 
            font-size:0.7rem; padding: 3px 8px; font-weight:bold; 
            box-shadow: -2px 2px 5px rgba(0,0,0,0.5);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes cardEnter { 
            from { transform: translateY(50px) scale(0.9); opacity: 0; } 
            to { transform: translateY(0) scale(1); opacity: 1; } 
        }

        /* === 历史记录面板 === */
        #history-panel {
            position: fixed; left: 0; top: 0; bottom: 0; width: 420px;
            background: rgba(15, 15, 18, 0.98);
            border-right: 1px solid #333; z-index: 150;
            transform: translateX(-100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column;
            box-shadow: 10px 0 40px rgba(0,0,0,0.7);
        }
        #history-panel.open { transform: translateX(0); }
        .hist-header { padding: 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #222; }
        .hist-list { flex: 1; overflow-y: auto; padding: 0; }
        .hist-item { padding: 15px 25px; border-bottom: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 6px; font-family: 'Consolas', monospace; }
        .hist-item:hover { background: rgba(255,255,255,0.05); }
        
        .hist-row-1 { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; }
        .hist-row-2 { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; }
        
        /* 修改点：标签文字颜色改为红色 */
        .tag-up-badge { 
            color: var(--text-red); 
            background: rgba(255, 51, 51, 0.1); 
            border: 1px solid var(--text-red);
            padding: 0 6px; font-size: 0.75rem; border-radius: 2px; font-weight: bold;
        }
        .tag-lost-badge { 
            color: var(--text-red); 
            border: 1px solid #555; 
            padding: 0 6px; font-size: 0.75rem; border-radius: 2px; 
        }

        .close-btn { background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;}
    </style>
</head>
<body>

    <div id="bg-layer" style="background-image: url('images/bg_levantine.jpg');"></div>

    <div class="top-bar">
        <div class="resource-tag">
            <span style="color:#aaa; font-size:0.8em">已投入合成玉</span>
            <span class="resource-icon"></span>
            <b id="res-spent" style="color: #fff; font-size: 1.2rem;">0</b>
        </div>
    </div>

    <div class="left-sidebar">
        <div class="pool-tab active" onclick="switchPool(0)"><span>限定寻访</span> <b>莱万汀</b></div>
        <div class="pool-tab" onclick="switchPool(1)"><span>限定寻访</span> <b>洁尔佩塔</b></div>
        <div class="pool-tab" onclick="switchPool(2)"><span>限定寻访</span> <b>伊冯</b></div>
    </div>

    <button class="history-btn" onclick="toggleHistory()"><span style="font-size:1.2em">≣</span> 档案记录</button>

    <div class="right-panel">
        <div class="banner-info">
            <h1 id="pool-name-display">LEVANTINE</h1>
            <div class="sub-text">概率提升中</div>
        </div>
        <div class="pity-counter">
            <div class="pity-row">
                <span>120次必得(UP):</span>
                <span id="txt-spark" class="pity-val">0 / 120</span>
            </div>
            <div class="pity-row">
                <span>6星保底:</span>
                <span id="txt-pity-6" class="pity-val">0 / 80</span>
            </div>
            <div style="font-size: 0.75rem; color:#888; margin-top:5px; border-top:1px solid #444; padding-top:5px;">
                规则: 65抽后6星概率每次+5%<br>10抽必得5星或以上
            </div>
        </div>
        <div class="action-btns">
            <button class="btn btn-white" onclick="doPull(1)">寻访一次<span class="sub">-500</span></button>
            <button class="btn btn-yellow" onclick="doPull(10)">寻访十次<span class="sub">-5000</span></button>
        </div>
        <div style="margin-top: 15px; opacity: 0.6; cursor: pointer; font-size: 0.8rem;" onclick="resetAll()">[ ⚠ 重置所有数据 ]</div>
    </div>

    <div class="overlay-layer" id="result-layer" onclick="closeResults()">
        <div class="result-grid" id="result-grid" onclick="event.stopPropagation()"></div>
        <div style="margin-top:40px; color:#888; border:1px solid #444; padding:8px 24px; border-radius:20px; cursor:pointer; font-size: 0.9rem;" onclick="closeResults()">点击任意空白处关闭</div>
    </div>

    <div id="history-panel">
        <div class="hist-header">
            <span style="font-weight:bold; letter-spacing:1px; font-size: 1.2rem;">6星获取记录</span>
            <button class="close-btn" onclick="toggleHistory()">×</button>
        </div>
        <div class="hist-list" id="hist-list-box"></div>
    </div>

<script>
    const POOL_BGS = ["images/bg_levantine.jpg", "images/bg_perlberta.jpg", "images/bg_yvonne.jpg"];
    const CHAR_IMAGES = {
        "莱万汀": "images/char_levantine.png", 
        "洁尔佩塔": "images/char_perlberta.png",
        "伊冯": "images/char_yvonne.png"
    };

    const BASE_PERM_6 = ["骏卫", "黎风", "余烬", "艾尔黛拉", "别礼"];
    const PERM_5_STARS = ["佩丽卡", "弧光", "艾维文娜", "大潘", "陈千语", "狼卫", "赛希", "昼雪", "阿列什"]; 
    const PERM_4_STARS = ["秋栗", "卡契尔", "埃特拉", "萤石", "安塔尔"];

    const POOLS = [
        { id: 'levantine', name: '莱万汀', upChar: '莱万汀', off: [...BASE_PERM_6, "伊冯", "洁尔佩塔"] },
        { id: 'perlberta', name: '洁尔佩塔', upChar: '洁尔佩塔', off: [...BASE_PERM_6, "伊冯", "莱万汀"] },
        { id: 'yvonne', name: '伊冯', upChar: '伊冯', off: [...BASE_PERM_6, "莱万汀", "洁尔佩塔"] }
    ];

    let globalPity6 = 0;   
    let globalPity5 = 0;   
    let totalSpent = 0;    
    let totalPullCount = 0;
    let historyLogs = [];      
    let currentPoolIndex = 0;  
    let poolSparkStates = { 0: {s:0, got:false}, 1: {s:0, got:false}, 2: {s:0, got:false} };

    function init() { switchPool(0); updateUI(); renderHistory(); }

    function switchPool(idx) {
        currentPoolIndex = idx;
        const pool = POOLS[idx];
        document.getElementById('bg-layer').style.backgroundImage = `url('${POOL_BGS[idx]}')`;
        document.getElementById('pool-name-display').innerText = pool.name;
        document.querySelectorAll('.pool-tab').forEach((tab, i) => {
            if(i === idx) tab.classList.add('active'); else tab.classList.remove('active');
        });
        updateUI();
    }

    function updateUI() {
        document.getElementById('res-spent').innerText = totalSpent.toLocaleString();
        document.getElementById('txt-pity-6').innerText = `${globalPity6} / 80`;

        const state = poolSparkStates[currentPoolIndex];
        const sparkText = document.getElementById('txt-spark');
        if (state.got) {
            sparkText.innerText = "已获取(UP)"; sparkText.style.color = "#666";
        } else {
            sparkText.innerText = `${state.s} / 120`; sparkText.style.color = "var(--accent-yellow)";
        }
    }

    function doPull(times) {
        totalSpent += (times * 500);
        let results = [];
        for(let i=0; i<times; i++) results.push(calcOnePull());
        showResults(results);
        updateUI();
    }

    function calcOnePull() {
        totalPullCount++;
        globalPity6++;
        globalPity5++;
        
        let sparkState = poolSparkStates[currentPoolIndex];
        if(!sparkState.got) sparkState.s++;

        let rank = 4; let name = "常规4星"; let isUp = false;

        let rate6 = 0.008; 
        if (globalPity6 >= 66) rate6 += (globalPity6 - 65) * 0.05;
        if (globalPity6 >= 80) rate6 = 1.0;

        let isSpark = (!sparkState.got && sparkState.s >= 120);

        if (isSpark || Math.random() < rate6) {
            rank = 6; globalPity6 = 0; globalPity5 = 0; 
            const pool = POOLS[currentPoolIndex];
            
            if (isSpark || Math.random() < 0.5) {
                name = pool.upChar; isUp = true; sparkState.got = true; sparkState.s = 0;
            } else {
                let offList = pool.off; name = offList[Math.floor(Math.random() * offList.length)];
            }
            addHistory(name, isUp, totalPullCount, pool.name);

        } else {
            let rate5 = 0.08; let isPity5 = (globalPity5 >= 10); 
            if (isPity5 || Math.random() < rate5) {
                rank = 5; globalPity5 = 0; name = PERM_5_STARS[Math.floor(Math.random() * PERM_5_STARS.length)];
            } else {
                rank = 4; name = PERM_4_STARS[Math.floor(Math.random() * PERM_4_STARS.length)];
            }
        }
        return { rank, name, isUp };
    }

    function addHistory(charName, isUp, totalCount, poolName) {
        historyLogs.unshift({
            name: charName, isUp: isUp, pool: poolName, total: totalCount,
            time: new Date().toLocaleTimeString()
        });
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('hist-list-box');
        if (historyLogs.length === 0) {
            list.innerHTML = `<div style="padding:40px; color:#555; text-align:center;">暂无6星记录</div>`;
            return;
        }
        let html = '';
        historyLogs.forEach(log => {
            let tag = log.isUp ? `<span class="tag-up-badge">UP</span>` : `<span class="tag-lost-badge">歪</span>`;
            // 修改点：干员名字颜色改为红色
            let nameColor = 'var(--text-red)'; 
            html += `
                <div class="hist-item">
                    <div class="hist-row-1">
                        <span style="color:${nameColor}">${log.name}</span>
                        <span>${tag}</span>
                    </div>
                    <div class="hist-row-2">
                        <span>卡池: ${log.pool}</span>
                        <span>总计第 ${log.total} 抽</span>
                    </div>
                </div>
            `;
        });
        list.innerHTML = html;
    }

    function toggleHistory() { document.getElementById('history-panel').classList.toggle('open'); }

    function showResults(list) {
        const overlay = document.getElementById('result-layer');
        const grid = document.getElementById('result-grid');
        grid.innerHTML = ''; 

        list.forEach((res, idx) => {
            const scene = document.createElement('div');
            scene.className = `card-scene r${res.rank}`;
            scene.style.animationDelay = `${idx * 0.1}s`;

            let bgStyle = '';
            if (CHAR_IMAGES[res.name]) {
                bgStyle = `background-image: url('${CHAR_IMAGES[res.name]}')`;
            }

            let upTag = res.isUp ? '<div class="tag-up">UP</div>' : '';

            scene.innerHTML = `
                <div class="card-obj" id="card-${idx}">
                    <div class="face back"></div>
                    <div class="face front" style="${bgStyle}">
                        ${upTag}
                        <div class="card-info">
                            <span class="card-star">${"★".repeat(res.rank)}</span>
                            <span class="card-name">${res.name}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(scene);

            setTimeout(() => {
                const cardObj = document.getElementById(`card-${idx}`);
                if(cardObj) cardObj.classList.add('flipped');
            }, 600 + (idx * 150)); 
        });

        overlay.classList.add('active');
    }

    function closeResults() { document.getElementById('result-layer').classList.remove('active'); }

    function resetAll() {
        if(!confirm("确定要重置所有记录吗？")) return;
        globalPity6 = 0; globalPity5 = 0; 
        totalSpent = 0; totalPullCount = 0;
        historyLogs = [];
        poolSparkStates = { 0: {s:0, got:false}, 1: {s:0, got:false}, 2: {s:0, got:false} };
        updateUI(); renderHistory();
    }

    init();
</script>
</body>
</html>
