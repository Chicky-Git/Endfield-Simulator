<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>终末地 | 寻访模拟系统</title>
    <link rel="preload" as="image" href="images/bg_levantine.jpg">
    <style>
        :root {
            --accent-yellow: #ffe600; 
            --ui-black: #1a1a1a;
            --ui-white: #ffffff;
            --r6-color: #ff4400; 
            --r5-color: #ffcc00; 
            --r4-color: #00ccff; 
            --text-red: #ff3333; 
            --text-dim-red: #cc5555;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #000;
            color: var(--ui-white);
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* === Loading 遮罩层 === */
        #loading-mask {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .loader {
            width: 40px; height: 40px;
            border: 3px solid #333; border-top: 3px solid var(--accent-yellow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        .loading-text { font-size: 0.8rem; color: #666; letter-spacing: 2px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* === 背景层 === */
        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center; 
            transition: background-image 0.4s ease; z-index: 0;
        }
        #bg-layer::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.9) 100%);
        }

        /* === UI 顶栏 (改回图片版) === */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            display: flex; justify-content: flex-end; align-items: center;
            padding: 0 20px; z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .resource-tag {
            background: rgba(0,0,0,0.6); padding: 4px 16px; border-radius: 30px;
            font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px);
        }
        .resource-icon { 
            width: 28px; height: 28px; object-fit: contain; 
            display: inline-block; vertical-align: middle; margin-top: -2px;
        }

        /* === 左侧卡池选择 === */
        .left-sidebar {
            position: absolute; top: 50%; left: 0; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; padding-left: 0; z-index: 10;
        }
        .pool-tab {
            width: 120px; height: 60px; background: rgba(0,0,0,0.6);
            border-left: 4px solid transparent; color: #aaa;
            cursor: pointer; display: flex; flex-direction: column; justify-content: center; 
            padding-left: 15px; transition: 0.2s; 
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);
            font-size: 0.9rem;
        }
        .pool-tab.active {
            background: var(--ui-white); color: var(--ui-black);
            border-left: 4px solid var(--accent-yellow); width: 140px; font-weight: bold;
        }

        /* === 历史记录按钮 === */
        .history-btn {
            position: absolute; bottom: 30px; left: 30px; z-index: 20;
            background: rgba(30,30,30,0.8); border: 1px solid #555;
            color: #ddd; padding: 10px 20px; cursor: pointer; border-radius: 4px;
            font-size: 0.9rem; transition: 0.3s;
        }

        /* === 右侧操作区 === */
        .right-panel {
            position: absolute; bottom: 30px; right: 30px;
            text-align: right; z-index: 10;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        .banner-info h1 { 
            font-size: 2.5rem; margin: 0; font-style: italic; 
            text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5); 
        }
        .banner-info .sub-text {
            color: var(--accent-yellow); font-size: 0.9rem; font-weight: bold;
            background: rgba(0,0,0,0.8); display: inline-block; padding: 2px 8px; margin-top: 5px;
        }
        .pity-counter {
            background: rgba(0,0,0,0.7); padding: 10px 15px; margin-bottom: 15px;
            border-left: 3px solid var(--accent-yellow); text-align: left;
            font-size: 0.8rem; color: #ddd; width: 240px; backdrop-filter: blur(4px);
        }
        .pity-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .pity-val { color: var(--accent-yellow); font-weight: bold; }
        
        .action-btns { display: flex; gap: 8px; }
        .btn {
            height: 55px; min-width: 120px; border: none; cursor: pointer;
            font-weight: bold; font-size: 1rem;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .btn:active { transform: scale(0.96); }
        .btn-white { background: #e0e0e0; color: #000; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
        .btn-yellow { background: var(--accent-yellow); color: #000; clip-path: polygon(0 0, 100% 0, 100% 50px, calc(100% - 10px) 100%, 0 100%); min-width: 150px; }
        .btn .sub { font-size: 0.7rem; opacity: 0.7; }

        /* === 抽卡结果弹窗 === */
        .overlay-layer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100;
            display: none; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; 
        }
        .overlay-layer.active { display: flex; animation: fadeIn 0.3s; }
        
        .result-grid { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; 
            max-width: 1200px; width: 90%; perspective: 1000px; margin-bottom: 20px;
        }
        .card-scene {
            aspect-ratio: 3/4.5; position: relative; opacity: 0; animation: cardEnter 0.5s forwards; width: 100%;
        }
        .card-obj {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .card-obj.flipped { transform: rotateY(180deg); }
        .face {
            position: absolute; inset: 0; backface-visibility: hidden; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column;
        }
        .face.back {
            background: #151515; border: 1px solid #333; justify-content: center; align-items: center;
            background-image: linear-gradient(45deg, transparent 45%, #333 49%, #333 51%, transparent 55%), linear-gradient(-45deg, transparent 45%, #333 49%, #333 51%, transparent 55%);
            background-size: 30px 30px;
        }
        .face.back::after { content: 'ENDFIELD'; color: #444; font-weight: 900; font-size: 1.2rem; transform: rotate(-45deg); }
        .card-scene.r6 .face.back { border: 2px solid var(--r6-color); box-shadow: 0 0 15px rgba(255, 68, 0, 0.2); }
        .card-scene.r6 .face.front { box-shadow: 0 0 25px rgba(255, 68, 0, 0.5); border-bottom: 4px solid var(--r6-color); }
        .face.front { background: #222; transform: rotateY(180deg); background-size: cover; background-position: center; border: 1px solid #444; }
        .card-info { 
            margin-top: auto; background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6));
            padding: 6px; text-align: center; position: relative; z-index: 2;
        }
        .card-name { font-size: 0.9rem; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-star { font-size: 1rem; display: block; margin-bottom: 2px; line-height: 1;}
        .r6 .card-star { color: var(--r6-color); } .r5 .card-star { color: var(--r5-color); } .r4 .card-star { color: var(--r4-color); }
        .tag-up { 
            position: absolute; top:0; right:0; background: #ff3333; color:white; 
            font-size:0.7rem; padding: 4px 6px; font-weight:bold; 
            border-bottom-left-radius: 8px; box-shadow: -2px 2px 5px rgba(0,0,0,0.5);
        }

        /* === 手机端适配 === */
        @media (max-width: 768px) {
            .left-sidebar { top: 40%; transform: translateY(-40%); }
            .right-panel { bottom: 20px; right: 20px; }
            .btn { height: 45px; font-size: 0.9rem; min-width: 100px; }
            .btn-yellow { min-width: 130px; }
            .overlay-layer { padding: 10px; }
            .result-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); height: 75vh; width: 95%; gap: 8px; margin-bottom: 10px; }
            .card-scene { aspect-ratio: unset; height: 100%; width: 100%; }
            .card-info { padding: 4px; }
            .card-name { font-size: 0.8rem; }
            .card-star { font-size: 0.8rem; margin-bottom: 0; }
            #close-hint { position: relative; margin-top: 10px; font-size: 0.8rem; padding: 6px 20px; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes cardEnter { from { transform: translateY(30px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

        /* === 历史记录面板 === */
        #history-panel {
            position: fixed; left: 0; top: 0; bottom: 0; width: 420px; max-width: 85vw;
            background: #0d0d0d; border-right: 1px solid #222; z-index: 150;
            transform: translateX(-100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column; box-shadow: 10px 0 40px rgba(0,0,0,0.9);
        }
        #history-panel.open { transform: translateX(0); }
        .hist-header { padding: 30px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .hist-list { flex: 1; overflow-y: auto; padding: 10px 0; }
        .hist-item { padding: 20px 30px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center;}
        .hist-info { display: flex; flex-direction: column; }
        .hist-name { font-size: 1.6rem; font-weight: bold; letter-spacing: 1px;}
        .name-up { color: var(--text-red); text-shadow: 0 0 10px rgba(255, 51, 51, 0.3); }
        .name-lost { color: var(--text-dim-red); opacity: 0.8; }
        .hist-meta { font-size: 0.75rem; color: #555; margin-top: 4px; font-weight: normal; }
        .tag-box-up { border: 2px solid var(--text-red); color: var(--text-red); border-radius: 8px; padding: 2px 8px; font-size: 1rem; font-weight: 900; line-height: 1.1; }
        .tag-text-lost { color: #666; font-size: 1.1rem; font-style: italic; font-weight: bold; padding-right: 5px; font-family: serif; }
        .close-btn { background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; }
    </style>
</head>
<body>

    <div id="loading-mask">
        <div class="loader"></div>
        <div class="loading-text">SYSTEM INITIALIZING...</div>
    </div>

    <div id="bg-layer" style="background-image: url('images/bg_levantine.jpg');"></div>

    <div class="top-bar">
        <div class="resource-tag">
            <span style="color:#bbb; font-size:0.85em">已投入</span>
            <img src="images/res_icon.png" class="resource-icon" alt="RES">
            <b id="res-spent" style="color: #fff; font-size: 1.1rem;">0</b>
        </div>
    </div>

    <div class="left-sidebar">
        <div class="pool-tab active" onclick="switchPool(0)"><span>限定寻访</span> <b>莱万汀</b></div>
        <div class="pool-tab" onclick="switchPool(1)"><span>限定寻访</span> <b>洁尔佩塔</b></div>
        <div class="pool-tab" onclick="switchPool(2)"><span>限定寻访</span> <b>伊冯</b></div>
    </div>

    <div class="history-btn" onclick="toggleHistory()">档案记录</div>

    <div class="right-panel">
        <div class="banner-info">
            <h1 id="pool-name-display">LEVANTINE</h1>
            <div class="sub-text">概率提升中</div>
        </div>
        <div class="pity-counter">
            <div class="pity-row">
                <span>120次必得(UP):</span>
                <span id="txt-spark" class="pity-val">0 / 120</span>
            </div>
            <div class="pity-row">
                <span>6星保底:</span>
                <span id="txt-pity-6" class="pity-val">0 / 80</span>
            </div>
        </div>
        <div class="action-btns">
            <button class="btn btn-white" onclick="doPull(1)">寻访一次<span class="sub">-500</span></button>
            <button class="btn btn-yellow" onclick="doPull(10)">寻访十次<span class="sub">-5000</span></button>
        </div>
        <div style="margin-top: 10px; opacity: 0.5; font-size: 0.75rem; cursor: pointer;" onclick="resetAll()">[ 重置数据 ]</div>
    </div>

    <div class="overlay-layer" id="result-layer" onclick="closeResults()">
        <div class="result-grid" id="result-grid" onclick="event.stopPropagation()"></div>
        <div id="close-hint" style="color:#888; border:1px solid #444; padding:8px 24px; border-radius:30px; cursor:pointer; font-size: 0.9rem;" onclick="closeResults()">
            点击空白处关闭
        </div>
    </div>

    <div id="history-panel">
        <div class="hist-header">
            <span style="font-weight:bold; letter-spacing:1px; font-size: 1.2rem;">寻访记录</span>
            <button class="close-btn" onclick="toggleHistory()">×</button>
        </div>
        <div class="hist-list" id="hist-list-box"></div>
    </div>

<script>
    // === 页面加载完成逻辑 ===
    window.addEventListener('load', () => {
        const mask = document.getElementById('loading-mask');
        setTimeout(() => {
            mask.style.opacity = '0'; // 淡出
            setTimeout(() => { mask.style.display = 'none'; }, 500); // 移除
        }, 800); // 稍微延迟一点，展示 Loading 动画
    });

    const POOL_BGS = ["images/bg_levantine.jpg", "images/bg_perlberta.jpg", "images/bg_yvonne.jpg"];
    const CHAR_IMAGES = {
        "莱万汀": "images/char_levantine.png", 
        "洁尔佩塔": "images/char_perlberta.png",
        "伊冯": "images/char_yvonne.png"
    };

    const BASE_PERM_6 = ["骏卫", "黎风", "余烬", "艾尔黛拉", "别礼"];
    const PERM_5_STARS = ["佩丽卡", "弧光", "艾维文娜", "大潘", "陈千语", "狼卫", "赛希", "昼雪", "阿列什"]; 
    const PERM_4_STARS = ["秋栗", "卡契尔", "埃特拉", "萤石", "安塔尔"];

    const POOLS = [
        { id: 'levantine', name: '莱万汀', upChar: '莱万汀', off: [...BASE_PERM_6, "伊冯", "洁尔佩塔"] },
        { id: 'perlberta', name: '洁尔佩塔', upChar: '洁尔佩塔', off: [...BASE_PERM_6, "伊冯", "莱万汀"] },
        { id: 'yvonne', name: '伊冯', upChar: '伊冯', off: [...BASE_PERM_6, "莱万汀", "洁尔佩塔"] }
    ];

    let globalPity6 = 0; let globalPity5 = 0; let totalSpent = 0; let totalPullCount = 0;
    let historyLogs = []; let currentPoolIndex = 0;
    let poolSparkStates = { 0: {s:0, got:false}, 1: {s:0, got:false}, 2: {s:0, got:false} };

    function init() { switchPool(0); updateUI(); renderHistory(); }

    function switchPool(idx) {
        currentPoolIndex = idx;
        const pool = POOLS[idx];
        document.getElementById('bg-layer').style.backgroundImage = `url('${POOL_BGS[idx]}')`;
        document.getElementById('pool-name-display').innerText = pool.name;
        document.querySelectorAll('.pool-tab').forEach((tab, i) => {
            if(i === idx) tab.classList.add('active'); else tab.classList.remove('active');
        });
        updateUI();
    }

    function updateUI() {
        document.getElementById('res-spent').innerText = totalSpent.toLocaleString();
        document.getElementById('txt-pity-6').innerText = `${globalPity6} / 80`;
        const state = poolSparkStates[currentPoolIndex];
        const sparkText = document.getElementById('txt-spark');
        if (state.got) {
            sparkText.innerText = "已获取(UP)"; sparkText.style.color = "#666";
        } else {
            sparkText.innerText = `${state.s} / 120`; sparkText.style.color = "var(--accent-yellow)";
        }
    }

    function doPull(times) {
        totalSpent += (times * 500);
        let results = [];
        for(let i=0; i<times; i++) results.push(calcOnePull());
        showResults(results);
        updateUI();
    }

    function calcOnePull() {
        totalPullCount++; globalPity6++; globalPity5++;
        let sparkState = poolSparkStates[currentPoolIndex];
        if(!sparkState.got) sparkState.s++;

        let rank = 4; let name = "常规4星"; let isUp = false;
        let rate6 = 0.008; 
        if (globalPity6 >= 66) rate6 += (globalPity6 - 65) * 0.05;
        if (globalPity6 >= 80) rate6 = 1.0;

        let isSpark = (!sparkState.got && sparkState.s >= 120);

        if (isSpark || Math.random() < rate6) {
            rank = 6; globalPity6 = 0; globalPity5 = 0; 
            const pool = POOLS[currentPoolIndex];
            if (isSpark || Math.random() < 0.5) {
                name = pool.upChar; isUp = true; sparkState.got = true; sparkState.s = 0;
            } else {
                let offList = pool.off; name = offList[Math.floor(Math.random() * offList.length)];
            }
            addHistory(name, isUp, totalPullCount, pool.name);
        } else {
            let rate5 = 0.08; let isPity5 = (globalPity5 >= 10); 
            if (isPity5 || Math.random() < rate5) {
                rank = 5; globalPity5 = 0; name = PERM_5_STARS[Math.floor(Math.random() * PERM_5_STARS.length)];
            } else {
                rank = 4; name = PERM_4_STARS[Math.floor(Math.random() * PERM_4_STARS.length)];
            }
        }
        return { rank, name, isUp };
    }

    function addHistory(charName, isUp, totalCount, poolName) {
        historyLogs.unshift({ name: charName, isUp: isUp, pool: poolName, total: totalCount });
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('hist-list-box');
        if (historyLogs.length === 0) { list.innerHTML = `<div style="padding:40px; color:#333; text-align:center;">// NO DATA //</div>`; return; }
        let html = '';
        historyLogs.forEach(log => {
            let tagHTML = log.isUp 
                ? `<div class="tag-box-up">UP</div>` 
                : `<div class="tag-text-lost">歪</div>`;
            let nameClass = log.isUp ? 'name-up' : 'name-lost';
            html += `
                <div class="hist-item">
                    <div class="hist-info">
                        <span class="hist-name ${nameClass}">${log.name}</span>
                        <span class="hist-meta">#${log.total} in ${log.pool}</span>
                    </div>
                    ${tagHTML}
                </div>`;
        });
        list.innerHTML = html;
    }

    function toggleHistory() { document.getElementById('history-panel').classList.toggle('open'); }

    function showResults(list) {
        const overlay = document.getElementById('result-layer');
        const grid = document.getElementById('result-grid');
        grid.innerHTML = ''; 
        
        list.forEach((res, idx) => {
            const scene = document.createElement('div');
            scene.className = `card-scene r${res.rank}`;
            scene.style.animationDelay = `${idx * 0.05}s`;
            let bgStyle = CHAR_IMAGES[res.name] ? `background-image: url('${CHAR_IMAGES[res.name]}')` : '';
            let upTag = res.isUp ? '<div class="tag-up">UP</div>' : '';

            scene.innerHTML = `
                <div class="card-obj" id="card-${idx}">
                    <div class="face back"></div>
                    <div class="face front" style="${bgStyle}">
                        ${upTag}
                        <div class="card-info">
                            <span class="card-star">${"★".repeat(res.rank)}</span>
                            <span class="card-name">${res.name}</span>
                        </div>
                    </div>
                </div>`;
            grid.appendChild(scene);
            setTimeout(() => { document.getElementById(`card-${idx}`)?.classList.add('flipped'); }, 400 + (idx * 100)); 
        });
        overlay.classList.add('active');
    }

    function closeResults() { document.getElementById('result-layer').classList.remove('active'); }

    function resetAll() {
        if(!confirm("确定重置？")) return;
        globalPity6 = 0; globalPity5 = 0; totalSpent = 0; totalPullCount = 0;
        historyLogs = []; poolSparkStates = { 0: {s:0, got:false}, 1: {s:0, got:false}, 2: {s:0, got:false} };
        updateUI(); renderHistory();
    }

    init();
</script>
</body>
</html>
